<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectrum Wave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Full-bleed canvas. Optional clock pinned to the right edge, as on the macOS Clocks screen. */
  :root {
    --paper: #ede9e6;
    --ink-soft: #a6a19c;
    --ink-faint: #9a958f;
    --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .clock { position: fixed; inset: 0; pointer-events: none; font-family: var(--font-mono); color: var(--ink-faint); }
  .clock[hidden] { display: none; }
  .meta {
    position: absolute;
    top: calc(2.6vh + env(safe-area-inset-top, 0px));
    right: calc(1.5vw + env(safe-area-inset-right, 0px));
    display: flex;
    gap: 3vw;
    font-size: max(9px, 0.95vh);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .time {
    position: absolute;
    bottom: calc(2.2vh + env(safe-area-inset-bottom, 0px));
    right: calc(1.5vw + env(safe-area-inset-right, 0px));
    font-size: max(20px, 2.9vh);
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
</style>

<canvas id="wave" role="img" aria-label="A wave-shaped ribbon of overlapping translucent circles, with a green, blue, pink, yellow and orange gradient slowly flowing through it"></canvas>
<div class="clock" id="clock" hidden>
  <div class="meta"><span id="date"></span><span id="day"></span></div>
  <div class="time" id="time"></div>
</div>

<script>
(() => {
  const TAU = Math.PI * 2;
  const LOOP = 60;              // seconds; every motion term completes whole cycles per loop
  const COUNT = 200;            // circles along the ribbon
  const SPAN = [-0.16, 1.16];   // first and last circle centre, as a fraction of the width
  const ALPHA = 0.3;            // opacity of each circle
  const RADIUS = 0.205;         // circle radius, as a fraction of the screen height
  const AMPLITUDE = 0.19;       // height of the wave, as a fraction of the screen height
  const RIPPLE = 0.03;          // how far the colours sway back and forth as they flow
  const MAX_FPS = 30;
  const PAPER = '#ede9e6';

  // Gradient (position, r, g, b). 0..1 is the ribbon as on the Clocks screen, green to orange;
  // 1..CYCLE carries it back to green through magenta and indigo so the flow can loop.
  const STOPS = [
    [0.00, 2, 72, 48],
    [0.15, 3, 95, 64],
    [0.23, 5, 100, 106],
    [0.30, 4, 104, 146],
    [0.35, 8, 115, 211],
    [0.40, 14, 118, 218],
    [0.44, 54, 123, 214],
    [0.48, 100, 131, 207],
    [0.52, 129, 136, 205],
    [0.56, 183, 148, 198],
    [0.60, 231, 159, 197],
    [0.64, 245, 164, 187],
    [0.68, 246, 169, 168],
    [0.72, 248, 175, 145],
    [0.76, 248, 178, 131],
    [0.80, 249, 184, 92],
    [0.84, 250, 193, 37],
    [0.87, 250, 178, 14],
    [0.90, 251, 140, 8],
    [0.93, 251, 98, 4],
    [1.00, 246, 64, 0],
    [1.07, 236, 40, 60],
    [1.15, 200, 40, 130],
    [1.23, 140, 50, 170],
    [1.31, 70, 55, 165],
    [1.40, 25, 60, 120],
    [1.50, 2, 72, 48],
  ];
  const CYCLE = 1.5;            // length of the gradient loop, in ribbon lengths

  function colourAt(u) {
    let i = 1;
    while (i < STOPS.length - 1 && STOPS[i][0] < u) i++;
    const a = STOPS[i - 1], b = STOPS[i];
    const k = Math.min(1, Math.max(0, (u - a[0]) / (b[0] - a[0])));
    return [1, 2, 3].map(c => Math.round(a[c] + (b[c] - a[c]) * k));
  }

  // The ribbon keeps its shape; the gradient flows through it from left to right.
  const SHADES = 2048;
  const shades = Array.from({ length: SHADES }, (_, i) => {
    const [r, g, b] = colourAt((CYCLE * i) / SHADES);
    return `rgba(${r},${g},${b},${ALPHA})`;
  });

  const canvas = document.getElementById('wave');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = Math.round(window.innerWidth * dpr);
    H = Math.round(window.innerHeight * dpr);
    canvas.width = W;
    canvas.height = H;
  }

  function draw(t) {
    const p = (t / LOOP) * TAU;
    const unit = Math.min(H, W / 1.4);
    const r = unit * RADIUS;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < COUNT; i++) {
      const u = i / (COUNT - 1);
      const xn = SPAN[0] + (SPAN[1] - SPAN[0]) * u;
      const y = H * 0.5 + unit * AMPLITUDE * Math.cos(TAU * (xn - 0.15) / 0.9);
      // Place in the gradient loop: one full cycle per LOOP, plus a gentle sway.
      const c = u - (CYCLE * t) / LOOP + RIPPLE * Math.sin(TAU * 1.5 * u - 3 * p);
      const m = ((c % CYCLE) + CYCLE) % CYCLE;
      ctx.fillStyle = shades[Math.floor((m / CYCLE) * SHADES) % SHADES];
      ctx.beginPath();
      ctx.arc(xn * W, y, r, 0, TAU);
      ctx.fill();
    }
  }

  // Frame-exact rendering hook for the video exporter.
  window.wallpaper = { draw, LOOP };
  resize();
  if (window.__WALLPAPER_RENDER__) return;

  const still = window.matchMedia('(prefers-reduced-motion: reduce)');
  let last = -Infinity;
  function tick(now) {
    if (now - last >= 1000 / MAX_FPS - 2) {
      last = now;
      draw(now / 1000);
    }
    if (!still.matches) requestAnimationFrame(tick);
  }
  function start() {
    last = -Infinity;
    if (still.matches) draw(0);
    else requestAnimationFrame(tick);
  }
  window.addEventListener('resize', () => { resize(); if (still.matches) draw(0); });
  still.addEventListener('change', start);
  start();

  // Clock overlay: add #clock to the URL, or press C.
  const clock = document.getElementById('clock');
  const fmtDate = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
  const fmtDay = new Intl.DateTimeFormat(undefined, { weekday: 'long' });
  const fmtTime = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  function updateClock() {
    const now = new Date();
    document.getElementById('date').textContent = fmtDate.format(now).replace('.', '');
    document.getElementById('day').textContent = fmtDay.format(now);
    document.getElementById('time').textContent = fmtTime.format(now);
  }
  function setClock(on) {
    clock.hidden = !on;
    if (on) updateClock();
  }
  setClock(location.hash === '#clock');
  setInterval(() => { if (!clock.hidden) updateClock(); }, 1000);
  window.addEventListener('hashchange', () => setClock(location.hash === '#clock'));
  window.addEventListener('keydown', e => { if (e.key === 'c' || e.key === 'C') setClock(clock.hidden); });
})();
</script>
